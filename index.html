<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>职业副驾驶 CareerCopilot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7ff,
                    #eef5ff,
                    #f9f2ff
                );

            color: #1f2937;
            min-height: 100vh;
        }

        /* 顶部导航 */

        .navbar {
            height: 70px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            box-shadow:
                0 2px 15px rgba(0,0,0,0.06);

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #6366f1,
                    #8b5cf6
                );

            -webkit-background-clip: text;
            color: transparent;
        }

        .nav-right {
            color: #6b7280;
            font-size: 14px;
        }

        /* 主体 */

        .container {
            width: 90%;
            max-width: 1200px;

            margin: 50px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;

            background:
                linear-gradient(
                    90deg,
                    #4f46e5,
                    #7c3aed
                );

            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            color: #6b7280;
            font-size: 17px;
        }

        /* 输入区域 */

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: rgba(255,255,255,0.95);

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 10px 35px rgba(31,41,55,0.08);

            border: 1px solid #e5e7eb;
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        textarea {
            width: 100%;
            min-height: 280px;

            resize: vertical;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            padding: 15px;

            font-size: 15px;
            line-height: 1.7;

            outline: none;

            font-family: inherit;
        }

        textarea:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }

        /* 按钮 */

        .button-area {
            text-align: center;
            margin: 30px 0;
        }

        button {
            border: none;

            padding: 15px 45px;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(99,102,241,0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 加载 */

        .loading {
            display: none;

            text-align: center;

            margin: 20px 0;

            color: #6366f1;

            font-weight: 600;
        }

        /* 结果 */

        .result-card {
            display: none;

            margin-top: 30px;
        }

        .result {
            line-height: 1.8;

            white-space: pre-wrap;

            color: #374151;
        }

        /* 响应式 */

        @media (max-width: 800px) {

            .workspace {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 32px;
            }

            .navbar {
                padding: 0 20px;
            }
        }

    </style>

</head>


<body>

    <!-- 顶部 -->

    <nav class="navbar">

        <div class="logo">
            CareerCopilot
        </div>

        <div class="nav-right">
            AI 求职与岗位匹配助手
        </div>

    </nav>


    <!-- 主体 -->

    <main class="container">

        <section class="hero">

            <h1>
                职业副驾驶
            </h1>

            <p>
                让 AI 帮你分析简历与岗位的匹配程度
            </p>

        </section>


        <!-- 输入区域 -->

        <section class="workspace">


            <!-- 简历 -->

            <div class="card">

                <h2>
                    📄 我的简历
                </h2>

                <textarea
                    id="resume"
                    placeholder="请输入你的简历内容，例如：

我是一名信息管理与信息系统专业的大学生，熟悉Python、SQL、数据分析和Web开发，具有项目开发和团队协作经验。"
                ></textarea>

            </div>


            <!-- JD -->

            <div class="card">

                <h2>
                    💼 目标岗位
                </h2>

                <textarea
                    id="jobDescription"
                    placeholder="请输入目标岗位JD，例如：

招聘岗位：互联网产品运营实习生。

要求具备数据分析能力、沟通能力、互联网产品理解能力，能够使用Python或SQL进行基础数据处理。"
                ></textarea>

            </div>

        </section>


        <!-- 分析按钮 -->

        <div class="button-area">

            <button
                id="analyzeButton"
                onclick="analyzeCareer()"
            >
                ✨ 开始AI分析
            </button>

        </div>


        <!-- 加载 -->

        <div
            class="loading"
            id="loading"
        >
            AI正在分析你的简历与岗位，请稍候……
        </div>


        <!-- 分析结果 -->

        <section
            class="card result-card"
            id="resultCard"
        >

            <h2>
                🎯 AI岗位匹配分析
            </h2>

            <div
                class="result"
                id="result"
            ></div>

        </section>

    </main>


    <script>

        async function analyzeCareer() {

            const resume =
                document.getElementById("resume").value.trim();

            const jobDescription =
                document.getElementById("jobDescription").value.trim();

            const button =
                document.getElementById("analyzeButton");

            const loading =
                document.getElementById("loading");

            const resultCard =
                document.getElementById("resultCard");

            const result =
                document.getElementById("result");


            // 检查输入

            if (!resume) {

                alert("请先填写你的简历内容！");

                return;
            }


            if (!jobDescription) {

                alert("请先填写目标岗位JD！");

                return;
            }


            // 开始加载

            button.disabled = true;

            button.innerText = "AI分析中...";

            loading.style.display = "block";

            resultCard.style.display = "none";


            try {

                const response = await fetch('https://careercopilot-655f.onrender.com/api/analyze', {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            resume: resume,
                            job_description:
                                jobDescription
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        "服务器请求失败：" +
                        response.status
                    );

                }


                if (!data.success) {

                    throw new Error(
                        data.error ||
                        "AI分析失败"
                    );

                }


                // 显示结果

                result.innerText =
                    data.result;

                resultCard.style.display =
                    "block";


                // 自动滚动

                resultCard.scrollIntoView({
                    behavior: "smooth"
                });


            } catch (error) {

                alert(
                    "分析失败：\n" +
                    error.message
                );

                console.error(error);

            } finally {

                button.disabled = false;

                button.innerText =
                    "✨ 开始AI分析";

                loading.style.display =
                    "none";
            }

        }

    </script>

</body>

</html>
