<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>职业副驾驶 CareerCopilot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8faff);
            color: #1f2937;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 34px;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #4f46e5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-size: 15px;
            outline: none;
        }

        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            margin-top: 20px;
            text-align: center;
            color: #6366f1;
        }

        #result {
            display: none;
            white-space: pre-wrap;
            line-height: 1.8;
            background: #f8fafc;
            border-radius: 12px;
            padding: 22px;
            border-left: 5px solid #6366f1;
        }

        .footer {
            text-align: center;
            color: #6b7280;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>CareerCopilot</h1>
    <p>AI 求职与岗位匹配助手</p>
</div>

<div class="container">

    <div class="card">

        <h2>📄 简历与岗位分析</h2>

        <label for="resume">你的简历</label>

        <textarea
            id="resume"
            placeholder="请输入你的简历内容，例如：我是信息管理与信息系统专业学生，熟悉 Python、SQL、数据分析和 Web 开发……"></textarea>

        <label for="job">目标岗位 JD</label>

        <textarea
            id="job"
            placeholder="请输入招聘岗位描述，例如：招聘互联网产品运营实习生，要求具备数据分析能力、沟通能力……"></textarea>

        <button id="analyzeBtn" onclick="analyze()">
            🚀 开始 AI 分析
        </button>

        <div id="loading">
            ⏳ AI 正在分析你的简历和岗位要求，请稍候……
        </div>

    </div>

    <div class="card">

        <h2>🤖 AI 分析结果</h2>

        <div id="result">
            分析结果将在这里显示
        </div>

    </div>

</div>

<div class="footer">
    CareerCopilot · AI 求职与岗位匹配助手
</div>

<script>

async function analyze() {

    const resume = document.getElementById("resume").value.trim();
    const job = document.getElementById("job").value.trim();

    const result = document.getElementById("result");
    const loading = document.getElementById("loading");
    const button = document.getElementById("analyzeBtn");

    if (!resume) {
        alert("请输入你的简历内容！");
        return;
    }

    if (!job) {
        alert("请输入目标岗位 JD！");
        return;
    }

    button.disabled = true;
    loading.style.display = "block";
    result.style.display = "none";

    try {

        const response = await fetch(
            "https://careercopilot-655f.onrender.com/api/analyze",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },

                body: JSON.stringify({
                    resume: resume,
                    job_description: job
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail
                    ? JSON.stringify(data.detail)
                    : "服务器请求失败"
            );
        }

        if (data.success) {

            result.textContent = data.result;
            result.style.display = "block";

        } else {

            result.textContent = "分析失败，请稍后重试。";
            result.style.display = "block";

        }

    } catch (error) {

        result.textContent =
            "❌ 请求失败\n\n" +
            error.message +
            "\n\n请检查网络连接或稍后再试。";

        result.style.display = "block";

    } finally {

        button.disabled = false;
        loading.style.display = "none";

    }
}

</script>

</body>
</html>
